<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-vk-light.svg" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="/favicon-vk-dark.svg" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark">
    <!-- Single (non-media) theme-color: kept in sync with the *in-app* theme at
         runtime by syncThemeColorMeta() so the macOS PWA title bar matches the
         page even when the OS color-scheme differs. Light is the boot fallback;
         the pre-paint script below switches it to dark for OS-dark users. -->
    <meta name="theme-color" content="#f2f2f2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Vibe Kanban">
    <title>Vibe Kanban</title>
    <script>
      // Apply the persisted theme variant ("skin") before first paint to avoid
      // a flash of the default theme. Theme presets are runtime-generated CSS
      // (see shared/lib/themePresets.ts); applyThemeVariant() caches the active
      // preset's CSS in 'vk-theme-variant-css', which we re-inject here. The
      // React effect (useApplyThemeVariant) re-applies and refreshes the cache.
      (function () {
        try {
          var v = localStorage.getItem('vk-theme-variant');
          if (v && v !== 'default') {
            document.documentElement.dataset.themeVariant = v;
            var css = localStorage.getItem('vk-theme-variant-css');
            if (css) {
              var style = document.createElement('style');
              style.id = 'vk-theme-variant';
              style.textContent = css;
              document.head.appendChild(style);
            }
          }
        } catch (e) {
          /* localStorage may be unavailable */
        }
        // Paint the PWA title-bar theme-color to the OS-preferred shade before
        // the app boots, so OS-dark users don't see a light flash. React then
        // keeps it synced with the real in-app theme (syncThemeColorMeta).
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            var tc = document.querySelector(
              'meta[name="theme-color"]:not([media])'
            );
            if (tc) tc.setAttribute('content', '#212121');
          }
        } catch (e) {
          /* matchMedia may be unavailable */
        }
      })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script>
      // Polyfill crypto.randomUUID for non-secure contexts (e.g. HTTP access
      // via LAN IP). Required because @tanstack/db calls crypto.randomUUID()
      // directly without a fallback.
      // See: https://github.com/TanStack/db/issues/784
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID !== 'function') {
        crypto.randomUUID = function () {
          var bytes = new Uint8Array(16);
          if (typeof crypto.getRandomValues === 'function') {
            crypto.getRandomValues(bytes);
          } else {
            for (var i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
          }
          // Set RFC 4122 v4 version and variant bits
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var h = [];
          for (var j = 0; j < 16; j++) h.push(bytes[j].toString(16).padStart(2, '0'));
          return (
            h[0] + h[1] + h[2] + h[3] + '-' +
            h[4] + h[5] + '-' +
            h[6] + h[7] + '-' +
            h[8] + h[9] + '-' +
            h[10] + h[11] + h[12] + h[13] + h[14] + h[15]
          );
        };
      }
    </script>
    <script type="module" src="/src/app/entry/Bootstrap.tsx"></script>
</body>

</html>
