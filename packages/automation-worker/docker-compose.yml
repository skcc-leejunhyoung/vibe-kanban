services:
  automation-worker:
    build:
      context: ../..
      dockerfile: packages/automation-worker/Dockerfile
    ports:
      - "${PORT:-8787}:8787"
    environment:
      PORT: 8787
      AUTOMATION_DATA_DIR: /data
      # Required: the worker refuses to start without a token (rules run as
      # trusted code, so the token is the gate). No default on purpose — set
      # ADMIN_TOKEN in .env before starting.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
    volumes:
      - automation-worker-data:/data

volumes:
  automation-worker-data:
